name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable

    - name: Build libbox.aar
      run: |
        git clone https://github.com/SagerNet/sing-box.git
        cd sing-box
        TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
        git checkout "$TAG"
        make lib_install
        export PATH="$PATH:$(go env GOPATH)/bin"
        gomobile bind -v -androidapi 23 -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false -target=android/arm64 -tags "with_gvisor,with_quic,with_utls,with_clash_api,with_wireguard,badlinkname,tfogo_checklinkname0" -ldflags "-X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" -o libbox.aar ./experimental/libbox
        mkdir -p ../app/libs
           - name: Show libbox API
     run: |
        mkdir -p /tmp/lb
        unzip -o app/libs/libbox.aar classes.jar -d /tmp/lb
        unzip -Z1 /tmp/lb/classes.jar | grep libbox | head -80
        javap -cp /tmp/lb/classes.jar io.nekohasekai.libbox.Libbox io.nekohasekai.libbox.PlatformInterface io.nekohasekai.libbox.SetupOptions io.nekohasekai.libbox.CommandServer io.nekohasekai.libbox.TunOptions || true cp libbox.aar ../app/libs/

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
